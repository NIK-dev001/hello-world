<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World // NIK-dev</title>
    <style>
       
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000000; 
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace; 
            overflow: hidden;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: #ffffff;
            font-size: 4rem; 
            font-weight: 700;
            letter-spacing: -2px;
            border-right: 4px solid #fff; 
            white-space: nowrap;
            overflow: hidden;
            width: 0; 

          
            animation: 
                typing 3s steps(30, end) forwards, 
                blink-caret 0.75s step-end infinite; 
        }

        p {
            color: #666;
            margin-top: 10px;
            font-size: 1rem;
            opacity: 0;
            animation: fadeIn 1s ease-in forwards 3.5s; 
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #fff; }
        }

       
        @keyframes fadeIn {
            to { opacity: 1; }
        }

    
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>hello world.</h1>
        <p>// initiated by @NIK-dev001</p>
    </div>

</body>
</html>
